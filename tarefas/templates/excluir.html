
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Tarefa</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'tarefas/estilo.css' %}">
</head>
<body>
    <div class="container">
        <h1>Excluir Tarefa</h1>

        <p>Tem certeza que deseja excluir "{{ tarefa.titulo }}"?</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Confirmar exclusão</button>
        </form>

        <a href="{% url 'detalhe_tarefa' tarefa.pk %}">Cancelar</a>
    </div>
</body>
</html>
